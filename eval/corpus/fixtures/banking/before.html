<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bank</title>
    <style>
      body {
        font-family: Tahoma, sans-serif;
        font-size: 11px;
        color: #888;
      }
      td {
        padding: 1px;
      }
    </style>
  </head>
  <body>
    <img
      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
      width="160"
      height="40"
    />
    <div><b>Transfer Funds</b></div>
    <table>
      <tr>
        <td>Amount</td>
        <td><input type="text" /></td>
      </tr>
      <tr>
        <td>From</td>
        <td>
          <select>
            <option>Checking 1234</option>
            <option>Savings 5678</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>To</td>
        <td>
          <select>
            <option>Savings 5678</option>
            <option>Checking 1234</option>
          </select>
        </td>
      </tr>
    </table>
    <input
      type="image"
      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
      width="60"
      height="20"
    />
    <div id="session" style="color: #ddd">Session expires in 60s</div>
  </body>
</html>
