<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Health products | Shop</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-size: 18px;
        color: #1a1a1a;
      }
      .price {
        color: #8a1c1c;
        font-weight: bold;
      }
      button {
        background: #1d4ed8;
        color: #fff;
        border: 0;
        padding: 12px 20px;
        font-size: 18px;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <header>
      <p>Sale: 50% off today only</p>
      <form role="search">
        <label for="search">Search products</label>
        <input id="search" type="search" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main>
      <h1>Health products</h1>
      <ul>
        <li>
          <img
            src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
            width="120"
            height="120"
            alt=""
          />
          <h2>Allergy relief tablets, 30 count</h2>
          <p class="price">$12.99</p>
          <button type="button">Add allergy relief tablets to cart</button>
        </li>
        <li>
          <img
            src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
            width="120"
            height="120"
            alt=""
          />
          <h2>Digital thermometer</h2>
          <p class="price">$9.49</p>
          <button type="button">Add digital thermometer to cart</button>
        </li>
      </ul>
    </main>
  </body>
</html>
